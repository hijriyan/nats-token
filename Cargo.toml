[package]
name = "nats-token"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "NATS JWT implementation using NKeys"

[dependencies]
base64 = "0.23.1"
chrono-tz = "0.10.4"
data-encoding = "2.11.1"
nkeys = "0.4.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.10.9", features = ["asm"] }
thiserror = "2.0.21"
url = "2.5.8"

[lib]
path = "src/lib.rs"
