[package]
name = "nats-token"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "NATS JWT implementation using NKeys"

[dependencies]
base64 = "0.22"
chrono-tz = "0.10"
data-encoding = "2"
nkeys = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["asm"] }
thiserror = "2"
url = "2"

[lib]
path = "src/lib.rs"
